version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mana-corner-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: mana-corner
    volumes:
      - mongo-data:/data/db
    networks:
      - mana-network

  backend:
    build: .
    container_name: mana-corner-backend
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/mana-corner
      JWT_SECRET: your_super_secret_key_change_in_production
      PORT: 5000
      NODE_ENV: production
    depends_on:
      - mongodb
    networks:
      - mana-network
    volumes:
      - ./uploads:/app/uploads

  frontend:
    build: ./client
    container_name: mana-corner-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://backend:5000/api
    depends_on:
      - backend
    networks:
      - mana-network

volumes:
  mongo-data:

networks:
  mana-network:
    driver: bridge
